[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contracanto"
version = "0.2.0"
description = "Orquestração local: Claude planeja e revisa, Antigravity implementa em worktrees Git."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
contracanto = "contracanto.cli:run"
contracanto-mcp = "contracanto.server:main"

[tool.setuptools]
packages = ["contracanto"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".agent-runs"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # o formatador cuida do comprimento; strings longas ficam como estão
    "RUF001",  # textos em português usam caracteres ambíguos de propósito
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Os testes usam closures em subTest, desempacotamento parcial e with aninhado por legibilidade.
"tests/*" = ["B023", "RUF059", "SIM117", "SIM105", "SIM102"]

[tool.mypy]
files = ["contracanto", "orchestrator.py", "mcp_server.py"]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# pywin32 não distribui tipos e só é instalado no Windows.
module = ["pywintypes", "win32api", "win32con", "win32job", "win32process"]
ignore_missing_imports = true
